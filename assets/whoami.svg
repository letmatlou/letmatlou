<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="whoami: Lethabo Matlou, BSc IT Security and Network Engineering at Eduvos, 2nd year, 13 distinctions across 19 modules; studying Network Security, Enterprise Network Management, IoT Security; Cisco Ethical Hacker labs; building automation, data pipelines and AI agents with guardrails; Johannesburg, South Africa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1220"/><stop offset="1" stop-color="#060912"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A2236"/><stop offset="1" stop-color="#0D1220"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity=".14"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#111a2c" stroke-width="1"/></pattern>
    <clipPath id="c"><rect width="1280" height="470" rx="16"/></clipPath>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .k{fill:#60A5FA}.v{fill:#E8EDF7}.p{fill:#22D3EE}.dim{fill:#747F93}.ok{fill:#22D3EE}

      .r1{animation-delay:.2s}.r2{animation-delay:.35s}.r3{animation-delay:.5s}.r4{animation-delay:.65s}.r5{animation-delay:.8s}.r6{animation-delay:.95s}.r7{animation-delay:1.1s}
      @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
      .cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
      .dot{animation:pl 2s ease-in-out infinite}@keyframes pl{50%{opacity:.4}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="470" fill="url(#bg)"/>
    <rect width="1280" height="470" fill="url(#grid)"/>
    <!-- title bar -->
    <rect width="1280" height="46" fill="url(#bar)"/>
    <circle cx="28" cy="23" r="7" fill="#3B82F6"/><circle cx="52" cy="23" r="7" fill="#60A5FA"/><circle cx="76" cy="23" r="7" fill="#22D3EE"/>
    <text x="640" y="29" text-anchor="middle" class="m" font-size="15" fill="#9CA5B8">lethabo@weblee: ~ — zsh</text>
    <circle cx="1196" cy="23" r="5" fill="#22D3EE" class="dot"/><text x="1210" y="28" class="m" font-size="13" fill="#22D3EE">online</text>
    <!-- prompt -->
    <text x="36" y="92" class="m" font-size="19"><tspan class="p">➜ </tspan><tspan fill="#60A5FA">~</tspan><tspan class="v"> whoami --verbose</tspan></text>
    <!-- rows -->
    <g class="m" font-size="18">
      <g class="row r1"><rect x="24" y="112" width="1232" height="38" rx="6" fill="url(#hl)"/>
        <text x="40" y="137" class="dim">01</text><text x="82" y="137" class="k">name</text><text x="212" y="137" class="dim">│</text><text x="236" y="137"><tspan class="v" font-weight="700">Lethabo Matlou</tspan></text></g>
      <g class="row r2"><text x="40" y="181" class="dim">02</text><text x="82" y="181" class="k">studying</text><text x="212" y="181" class="dim">│</text><text x="236" y="181"><tspan class="v">BSc IT · Security &amp; Network Engineering </tspan><tspan class="dim">@ </tspan><tspan class="p">Eduvos</tspan><tspan class="dim"> (2nd year)</tspan></text></g>
      <g class="row r3"><text x="40" y="223" class="dim">03</text><text x="82" y="223" class="k">record</text><text x="212" y="223" class="dim">│</text><text x="236" y="223"><tspan class="p" font-weight="700">13</tspan><tspan class="v"> distinctions across </tspan><tspan class="p" font-weight="700">19</tspan><tspan class="v"> modules</tspan></text>
        <rect x="640" y="208" width="260" height="12" rx="6" fill="#1A2236"/><rect x="640" y="208" width="178" height="12" rx="6" fill="#22D3EE"><animate attributeName="width" from="0" to="178" dur="1.4s" begin=".6s" fill="freeze"/></rect>
        <text x="916" y="223" class="dim" font-size="15">13 / 19</text></g>
      <g class="row r4"><text x="40" y="265" class="dim">04</text><text x="82" y="265" class="k">right_now</text><text x="212" y="265" class="dim">│</text><text x="236" y="265"><tspan class="v">Network Security · Enterprise Network Mgmt · IoT Security</tspan></text></g>
      <g class="row r5"><text x="40" y="307" class="dim">05</text><text x="82" y="307" class="k">hacking</text><text x="212" y="307" class="dim">│</text><text x="236" y="307"><tspan class="v">Cisco Ethical Hacker </tspan><tspan class="dim">→ </tspan><tspan class="p">Kali · Nmap · Wireshark · Scapy</tspan></text></g>
      <g class="row r6"><text x="40" y="349" class="dim">06</text><text x="82" y="349" class="k">building</text><text x="212" y="349" class="dim">│</text><text x="236" y="349"><tspan class="v">automation · data pipelines · AI agents </tspan><tspan class="p">with guardrails</tspan></text></g>
      <g class="row r7"><text x="40" y="391" class="dim">07</text><text x="82" y="391" class="k">based_in</text><text x="212" y="391" class="dim">│</text><text x="236" y="391"><tspan class="v">Johannesburg, South Africa</tspan></text></g>
    </g>
    <text x="36" y="440" class="m" font-size="19"><tspan class="p">➜ </tspan><tspan fill="#60A5FA">~</tspan><tspan class="v"> </tspan><tspan class="p cur">▋</tspan></text>
    <text x="1244" y="440" text-anchor="end" class="m" font-size="14" fill="#747F93">open to internships · cloud · data · security</text>
    <rect x="1" y="1" width="1278" height="468" rx="16" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="2"/>
  </g>
</svg>
