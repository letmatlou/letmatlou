<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="How I build: fail closed; secrets out of code; AI is untrusted input; report what's true">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1220"/><stop offset="1" stop-color="#060912"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
<style>.m{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}.s{font-family:'Segoe UI','Inter',Helvetica,Arial,sans-serif}</style></defs>
