<text x="276" y="54" text-anchor="end" class="m" font-size="30" font-weight="700" fill="#1A2236">04</text>
<text x="24" y="130" class="m" font-size="15" font-weight="700" letter-spacing="1.2" fill="#E8EDF7">REPORT WHAT'S TRUE</text>
<rect x="24" y="142" width="36" height="2" fill="#3B82F6"/>
<text x="24" y="174" class="s" font-size="16" fill="#9CA5B8">Tests, real numbers and</text>
<text x="24" y="198" class="s" font-size="16" fill="#9CA5B8">negative results,</text>
<text x="24" y="222" class="s" font-size="16" fill="#9CA5B8">not hype.</text>
