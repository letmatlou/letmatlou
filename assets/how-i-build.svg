<text x="276" y="54" text-anchor="end" class="m" font-size="30" font-weight="700" fill="#1A2236">02</text>
<text x="24" y="130" class="m" font-size="15" font-weight="700" letter-spacing="1.2" fill="#E8EDF7">SECRETS OUT OF CODE</text>
<rect x="24" y="142" width="36" height="2" fill="#3B82F6"/>
<text x="24" y="174" class="s" font-size="16" fill="#9CA5B8">Keys live in env files and</text>
<text x="24" y="198" class="s" font-size="16" fill="#9CA5B8">credential stores,</text>
<text x="24" y="222" class="s" font-size="16" fill="#9CA5B8">never in git.</text>
</g>
<g transform="translate(652,0)">
<rect x="1" y="1" width="300" height="248" rx="14" fill="url(#bg)" stroke="#1A2236" stroke-width="2"/>
<rect x="1" y="1" width="300" height="4" rx="2" fill="url(#top)"/>
<circle cx="52" cy="62" r="30" fill="#060912" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5"/>
<g transform="translate(52,62)" fill="none" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-16" y="-14" width="32" height="28" rx="6"/><circle cx="-6" cy="-1" r="3"/><circle cx="6" cy="-1" r="3"/><path d="M-6 8 H6 M0 -14 V-21 M-21 -2 V4 M21 -2 V4"/></g>
<text x="276" y="54" text-anchor="end" class="m" font-size="30" font-weight="700" fill="#1A2236">03</text>
<text x="24" y="130" class="m" font-size="15" font-weight="700" letter-spacing="1.2" fill="#E8EDF7">AI IS UNTRUSTED INPUT</text>
<rect x="24" y="142" width="36" height="2" fill="#3B82F6"/>
<text x="24" y="174" class="s" font-size="16" fill="#9CA5B8">Agents draft. A person</text>
<text x="24" y="198" class="s" font-size="16" fill="#9CA5B8">approves anything that</text>
<text x="24" y="222" class="s" font-size="16" fill="#9CA5B8">leaves the building.</text>
</g>
<g transform="translate(978,0)">
