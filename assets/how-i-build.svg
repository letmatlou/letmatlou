<text x="276" y="54" text-anchor="end" class="m" font-size="30" font-weight="700" fill="#1A2236">01</text>
<text x="24" y="130" class="m" font-size="15" font-weight="700" letter-spacing="1.2" fill="#E8EDF7">FAIL CLOSED</text>
<rect x="24" y="142" width="36" height="2" fill="#3B82F6"/>
<text x="24" y="174" class="s" font-size="16" fill="#9CA5B8">If a safety check can't be</text>
<text x="24" y="198" class="s" font-size="16" fill="#9CA5B8">completed, the system stops</text>
<text x="24" y="222" class="s" font-size="16" fill="#9CA5B8">instead of guessing.</text>
</g>
<g transform="translate(326,0)">
<rect x="1" y="1" width="300" height="248" rx="14" fill="url(#bg)" stroke="#1A2236" stroke-width="2"/>
<rect x="1" y="1" width="300" height="4" rx="2" fill="url(#top)"/>
