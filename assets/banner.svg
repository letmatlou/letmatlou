<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Lethabo Matlou: Security and Network Engineering, automation and cloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="1" stop-color="#0D1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8EDF7"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A2236" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Inter',Helvetica,Arial,sans-serif; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: .4s } .d2 { animation-delay: .8s } .d3 { animation-delay: 1.2s } .d4 { animation-delay: 1.6s }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.25) } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .fade { animation: fade .9s ease-out backwards; }
      .f2 { animation-delay: .35s } .f3 { animation-delay: .7s } .f4 { animation-delay: 1.05s }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)" opacity="0.7"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
    <rect x="-300" y="0" width="300" height="360" fill="url(#scan)">
      <animate attributeName="x" from="-300" to="1280" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- left: identity -->
    <g class="fade">
      <text x="72" y="92" class="mono" font-size="20" fill="#22D3EE">~/letmatlou <tspan fill="#747F93">$</tspan> <tspan fill="#E8EDF7">whoami</tspan><tspan class="cursor" fill="#22D3EE"> ▌</tspan></text>
    </g>
    <g class="fade f2">
      <text x="68" y="168" class="sans" font-size="68" font-weight="800" letter-spacing="1" fill="url(#name)">LETHABO MATLOU</text>
    </g>
    <g class="fade f3">
      <text x="72" y="214" class="sans" font-size="24" fill="#C9D1E0">Security &amp; Network Engineering <tspan fill="#3B82F6">·</tspan> Automation <tspan fill="#3B82F6">·</tspan> Cloud &amp; AI</text>
    </g>
    <g class="fade f4">
      <rect x="72" y="244" width="262" height="40" rx="20" fill="#0D1220" stroke="#22D3EE" stroke-width="1.5"/>
      <circle cx="96" cy="264" r="6" fill="#22D3EE" class="pulse"/>
      <text x="112" y="270" class="mono" font-size="16" fill="#E8EDF7">Open to internships</text>
      <rect x="350" y="244" width="300" height="40" rx="20" fill="#0D1220" stroke="#2A3550" stroke-width="1.5"/>
      <text x="372" y="270" class="mono" font-size="16" fill="#9CA5B8">Cisco Ethical Hacker <tspan fill="#60A5FA">· mod 3</tspan></text>
      <rect x="666" y="244" width="150" height="40" rx="20" fill="#0D1220" stroke="#2A3550" stroke-width="1.5"/>
      <text x="688" y="270" class="mono" font-size="16" fill="#9CA5B8">JHB <tspan fill="#60A5FA">· ZA</tspan></text>
    </g>

    <!-- right: network topology with packets -->
    <g stroke="#2A3550" stroke-width="2" fill="none">
      <path id="l1" d="M920 110 L1040 180"/>
      <path id="l2" d="M1040 180 L1170 110"/>
      <path id="l3" d="M1040 180 L1040 290"/>
      <path id="l4" d="M920 110 L920 250 L1040 290"/>
      <path id="l5" d="M1170 110 L1170 250 L1040 290"/>
    </g>
    <g fill="#22D3EE">
      <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
      <circle r="4" fill="#60A5FA"><animateMotion dur="3.1s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l3"/></animateMotion></circle>
      <circle r="4" fill="#3B82F6"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#l4"/></animateMotion></circle>
      <circle r="4" fill="#60A5FA"><animateMotion dur="3.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l5"/></animateMotion></circle>
    </g>
    <!-- nodes -->
    <g>
      <circle cx="920" cy="110" r="22" fill="#0D1220" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="920" cy="110" r="7" fill="#3B82F6" class="pulse"/>
      <circle cx="1170" cy="110" r="22" fill="#0D1220" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="1170" cy="110" r="7" fill="#3B82F6" class="pulse d2"/>
      <circle cx="920" cy="250" r="16" fill="#0D1220" stroke="#2A3550" stroke-width="2"/>
      <circle cx="920" cy="250" r="5" fill="#60A5FA" class="pulse d3"/>
      <circle cx="1170" cy="250" r="16" fill="#0D1220" stroke="#2A3550" stroke-width="2"/>
      <circle cx="1170" cy="250" r="5" fill="#60A5FA" class="pulse d4"/>
      <circle cx="1040" cy="290" r="20" fill="#0D1220" stroke="#2A3550" stroke-width="2"/>
      <circle cx="1040" cy="290" r="6" fill="#60A5FA" class="pulse d1"/>
      <!-- core: shield -->
      <circle cx="1040" cy="180" r="40" fill="#0D1220" stroke="#22D3EE" stroke-width="2.5"/>
      <circle cx="1040" cy="180" r="52" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 8">
        <animateTransform attributeName="transform" type="rotate" from="0 1040 180" to="360 1040 180" dur="14s" repeatCount="indefinite"/>
      </circle>
      <path d="M1040 158 L1059 166 V181 C1059 193 1050 201 1040 205 C1030 201 1021 193 1021 181 V166 Z" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M1031 181 L1038 188 L1050 174" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1040" y="338" text-anchor="middle" class="mono" font-size="13" fill="#747F93">fail closed · secrets out of code · AI as untrusted input</text>
    <rect x="1" y="1" width="1278" height="358" rx="18" fill="none" stroke="#1A2236" stroke-width="2"/>
  </g>
</svg>
