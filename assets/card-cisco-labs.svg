  <text x="28" y="48" class="mono" font-size="13" fill="#22D3EE">// kali · nmap · wireshark · nvd</text>
  <text x="28" y="84" class="sans" font-size="28" font-weight="700" fill="#E8EDF7">cisco-ethical-hacker-labs</text>
  <text x="28" y="118" class="sans" font-size="15" fill="#C9D1E0">Write-ups from my own lab VMs: a pentest scope under POPIA and</text>
  <text x="28" y="140" class="sans" font-size="15" fill="#C9D1E0">the Cybercrimes Act, 23 services fingerprinted, a Telnet password</text>
  <text x="28" y="162" class="sans" font-size="15" fill="#C9D1E0">read off the wire, and scan results matched to CVEs with my own tool.</text>
  <line x1="28" y1="186" x2="592" y2="186" stroke="#1A2236" stroke-width="1.5"/>
  <text x="28" y="226" class="sans" font-size="30" font-weight="800" fill="#22D3EE">4</text>
