  <text x="200" y="246" class="mono" font-size="11" fill="#747F93">SERVICES ENUMERATED</text>
  <text x="592" y="232" text-anchor="end" class="mono" font-size="12" fill="#9CA5B8">Kali · Nmap · Wireshark</text>
