<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" role="img" aria-label="cisco-ethical-hacker-labs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1220"/><stop offset="1" stop-color="#060912"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .sans{font-family:'Segoe UI','Inter',Helvetica,Arial,sans-serif}
      .glow{animation:g 3s ease-in-out infinite}
      @keyframes g{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
